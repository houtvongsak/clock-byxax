# Keeps holidays/ current without anyone running bin/generate-holidays: once
# a year (and on demand from the Actions tab) it regenerates the data with
# the latest python-holidays, moving the window to this year −5 … +10, and
# commits the result and cuts a patch release (bin/release) if anything
# changed.
name: Refresh holidays

on:
  schedule:
    - cron: "0 3 2 1 *" # Jan 2, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install --upgrade holidays

      - run: python bin/generate-holidays

      - name: Commit if changed
        run: |
          git add -A holidays
          if git diff --cached --quiet; then
            echo "Holidays already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          version=$(python -c 'import holidays; print(holidays.__version__)')
          years=$(jq -r '.years | join("–")' holidays/index.json)
          git commit -q -m "Refresh holidays (python-holidays $version)"
          bin/release patch "Refreshed holiday data for $years (python-holidays $version)."
