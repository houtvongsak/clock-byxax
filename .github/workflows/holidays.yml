# Keeps holidays/ current without anyone running bin/generate-holidays: once
# a year (and on demand from the Actions tab) it regenerates the data with
# the latest python-holidays, moving the window to this year −5 … +10, and
# commits the result and cuts a patch release (bin/release) if anything
# changed.
#
# Split in two so third-party code never holds a write token: `generate`
# installs python-holidays from PyPI with read-only access and hands over
# only the generated files; `publish` has write access, installs nothing, and
# accepts nothing but well-formed holiday JSON under holidays/.
name: Refresh holidays

on:
  schedule:
    - cron: "0 3 2 1 *" # Jan 2, 03:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gen.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - id: gen
        run: |
          pip install --upgrade holidays
          python bin/generate-holidays
          echo "version=$(python -c 'import holidays; print(holidays.__version__)')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holidays
          path: holidays/
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GENERATOR_VERSION: ${{ needs.generate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: holidays
          path: ${{ runner.temp }}/holidays

      # The artifact is untrusted: only two-letter country files plus
      # index.json, each the exact JSON shape the calendar reads.
      - name: Validate generated data
        run: |
          dir="$RUNNER_TEMP/holidays"
          [[ $GENERATOR_VERSION =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "bad version: $GENERATOR_VERSION"; exit 1; }
          for f in "$dir"/*; do
            name=$(basename "$f")
            [[ -f $f && ! -L $f ]] || { echo "not a regular file: $name"; exit 1; }
            if [[ $name == index.json ]]; then
              jq -e '(.countries | type == "array" and length > 0)
                and all(.countries[]; (.code | test("^[A-Z]{2}$")) and (.name | type == "string"))
                and (.years | type == "array" and length == 2 and all(.[]; type == "number"))' "$f" >/dev/null \
                || { echo "invalid index.json"; exit 1; }
            elif [[ $name =~ ^[A-Z]{2}\.json$ ]]; then
              jq -e 'type == "object"
                and all(to_entries[]; (.key | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                  and (.value | type == "array") and all(.value[]; type == "string"))' "$f" >/dev/null \
                || { echo "invalid $name"; exit 1; }
            else
              echo "unexpected file: $name"; exit 1
            fi
          done
          rm -rf holidays && cp -r "$dir" holidays

      - name: Commit and release if changed
        run: |
          git add -A holidays
          if git diff --cached --quiet; then
            echo "Holidays already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          years=$(jq -r '.years | join("–")' holidays/index.json)
          git commit -q -m "Refresh holidays (python-holidays $GENERATOR_VERSION)"
          bin/release patch "Refreshed holiday data for $years (python-holidays $GENERATOR_VERSION)."
